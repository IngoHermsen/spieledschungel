<h3>Hör-Reise durch den SpieleDschungel</h3>

<div class="audio-story">
  <p>Titel</p>
  <p>Höre dir die Geschichte Kapitel für Kapitel an.</p>

  <audio #journeyAudioPlayer controls (ended)="onChapterEnded()"></audio>

  <div class="chapters">
    @for (chapter of chapters; track chapter.file; let i = $index) {
      <button type="button"
      [class.active]="i === currentChapter"
      (click)="playChapter(i)">

        {{ i + 1 }} – {{ chapter.title }}

      </button>
    }
  </div>
</div>
