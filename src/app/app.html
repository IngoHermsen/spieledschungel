<div
  [class.disable-scroll]="viewService.activeModal() || viewService.navIsOpen()"
  class="full-screen-content"
>
  <!-- Book Modal -->
  @if (viewService.activeModal()) {
    <div class="modal-overlay">
      <app-modal></app-modal>
    </div>
  }
  <!-- END of Book Modal -->
  <div class="website-content">
    @if(!routeIsStandalone) {
          <app-navigation></app-navigation>
    }
    
      <div [class.transparent-bg]="viewService.transparentContentBackground()" class="outlet-content" id="activeContent" #outlet>
        <div class="contact-banner">
          <a href="mailto:panda@spieledschungel.de" target="_blank" class="click-overlay mail"></a>
          <a href="sms:+4915233527042" target="_blank" class="click-overlay phone"></a>
          <img src="assets/images/contact-banner.jpeg" alt="contact-banner-tiger-panda" />
        </div>

        <div class="content-wrapper">
          <router-outlet></router-outlet>
        </div>
      </div>
    @if(!routeIsStandalone) {
          <app-footer></app-footer>
    }
  </div>
</div>
